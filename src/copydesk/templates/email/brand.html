{% set logo = email_brand() %}
{% if logo.src and design.brand_display != 'name' %}<img src="{{ logo.src }}" alt="{{ site.name if design.brand_display != 'both' else '' }}" width="{{ logo.width }}" height="{{ logo.height }}" style="display:{{ 'inline-block' if design.brand_display == 'both' else 'block' }};height:auto;max-width:100%;width:{{ logo.width }}px;border:0;vertical-align:middle;{% if es.align == 'center' %}margin-left:auto;margin-right:auto;{% endif %}">{% if design.brand_display == 'both' %} <span>{{ site.name }}</span>{% endif %}{% else %}{{ site.name }}{% endif %}
