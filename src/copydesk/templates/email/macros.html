{% macro button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 24px;">
  <tr>
    <td style="border-radius:8px;background-color:{{ accent.accent }};">
      <a href="{{ url }}" style="display:inline-block;padding:12px 22px;font-family:{{ es.font }};font-size:16px;font-weight:700;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
{% endmacro %}

{% macro link_fallback(url) %}
<p style="{{ es.small }}">If the button doesn't work, copy this link into your browser:<br><a href="{{ url }}" style="color:{{ accent.accent }};word-break:break-all;">{{ url }}</a></p>
{% endmacro %}

{% macro quote(text) %}
<div style="{{ es.quote }}">{{ text|markdown }}</div>
{% endmacro %}
