{# Light is the default; Dark and Automatic match the launcher's Appearance setting. site.js enables it. #}
<div class="appearance" data-appearance-control hidden>
  <span class="kicker" id="appearance-label">Appearance</span>
  <div class="segments" role="group" aria-labelledby="appearance-label">
    <button type="button" class="segment" data-appearance-choice="light" aria-pressed="true">Light</button>
    <button type="button" class="segment" data-appearance-choice="dark" aria-pressed="false">Dark</button>
    <button type="button" class="segment" data-appearance-choice="auto" aria-pressed="false">Automatic</button>
  </div>
</div>
