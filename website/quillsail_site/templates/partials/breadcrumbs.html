{% if breadcrumbs %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {% for item in breadcrumbs %}
    <li>{% if loop.last %}<span aria-current="page">{{ item.title }}</span>{% else %}<a href="{{ item.url }}">{{ item.title }}</a>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
