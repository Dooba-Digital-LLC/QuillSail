# Navigation for docs.quillsail.blog, in reading order.
#
# Pages are the repository's own Markdown files, so they read the same on
# GitHub. Every file under docs/ must be listed here or under `exclude`, and the
# website's tests check that, along with every link between pages.
#
# `slug` is the page's address. It defaults to the file's path under docs/,
# without ".md" (docs/reference/cli.md becomes /reference/cli).

exclude = []

