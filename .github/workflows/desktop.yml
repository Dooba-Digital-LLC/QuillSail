name: Desktop bundles
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all four tested downloads as a desktop beta release
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/*desktop*'
      - 'scripts/*update*'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  server:
    name: Build and test server package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/build_server_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-server-package
          path: dist/server-release/
          if-no-files-found: error
          retention-days: 14
  desktop:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            python_arch: arm64
          - target: macos-x86_64
            os: macos-15-intel
            python_arch: x64
          - target: windows-x86_64
            os: windows-2022
            python_arch: x64
          - target: linux-x86_64
            os: ubuntu-22.04
            python_arch: x64
    runs-on: ${{ matrix.os }}
    env:
      OPENSSL_STATIC: '1'
    # Manual runs wait for Apple to notarize each Mac app and disk image.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          # Separate the large desktop dependency cache from server/test jobs.
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/desktop.yml
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg desktop-file-utils xvfb libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcb-xfixes0
      - name: Install Windows graphical installer builder
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Prepare Developer ID signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Fork and Dependabot pull requests get no secrets, so they build ad-hoc signed apps,
          # which publishing rejects. Pull requests sign; manual runs also notarize.
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "No Developer ID certificate is available. This build stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/quillsail-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 doesn't contain a valid Developer ID Application certificate and key."
            exit 1
          fi
          echo "Signing with $identity"
          echo "QUILLSAIL_MACOS_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "QUILLSAIL_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            xcrun notarytool store-credentials quillsail-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "QUILLSAIL_NOTARY_PROFILE=quillsail-notary" >> "$GITHUB_ENV"
          fi
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install only the wheel and desktop build dependencies
        shell: bash
        run: python -m pip install "$(echo dist/*.whl)[desktop-build]"
      - name: Build and test native desktop
        if: runner.os != 'Linux'
        run: python scripts/build_desktop.py --target ${{ matrix.target }}
      - name: Build and test Linux desktop with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python scripts/build_desktop.py --target ${{ matrix.target }}
      - name: Summarize native macOS crash diagnostics
        if: failure() && runner.os == 'macOS'
        run: python scripts/desktop_diagnostics.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*-setup.exe
            dist/desktop/*.deb
            dist/desktop/*.zip
            dist/desktop/*.tar.gz
            dist/desktop/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: if [ -n "${QUILLSAIL_MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$QUILLSAIL_MACOS_KEYCHAIN"; fi
  publish:
    name: Publish four desktop downloads
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [desktop, server]
    runs-on: ubuntu-22.04
    concurrency:
      group: desktop-update-feed
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: desktop-downloads/
          merge-multiple: true
      - run: python -m pip install .
      - name: Validate all four artifacts and publish the desktop beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_COMMIT: ${{ github.sha }}
          DESKTOP_UPDATE_KEYS: ${{ secrets.DESKTOP_UPDATE_KEYS }}
        run: python scripts/publish_desktop.py desktop-downloads
