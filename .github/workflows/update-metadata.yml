name: Refresh signed desktop update metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  group: desktop-update-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Renew the signed metadata without changing application downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_UPDATE_KEYS: ${{ secrets.DESKTOP_UPDATE_KEYS }}
        run: |
          if [ -z "$DESKTOP_UPDATE_KEYS" ]; then
            echo "Desktop update signing is not configured."
            exit 0
          fi
          python scripts/update_feed.py publish
