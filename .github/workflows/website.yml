name: Website
on:
  push:
    paths:
      - 'website/**'
      - 'docs/**'
      - '*.md'
      - 'src/copydesk/updates/root.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '*.md'
      - 'src/copydesk/updates/root.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Website on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu runs the Linux installer and PowerShell parse checks; macOS runs the Mac installer.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
